<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    GradeDesk mark.

    A grade sheet seen as a column of marks with a checked top row: the app is a
    ledger, not a chart. The green is the same brand green as the interface, and
    the tick is the transmutation result the instructor is really after.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a8360"/>
      <stop offset="1" stop-color="#215439"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0d1420" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- rounded app tile -->
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#brand)"/>

  <!-- the sheet -->
  <g filter="url(#soft)">
    <rect x="112" y="96" width="288" height="330" rx="26" fill="url(#paper)"/>
  </g>

  <!-- header band -->
  <rect x="112" y="96" width="288" height="58" rx="26" fill="#20293a"/>
  <rect x="112" y="130" width="288" height="24" fill="#20293a"/>
  <rect x="146" y="118" width="118" height="14" rx="7" fill="#8fa6b8" opacity="0.9"/>

  <!-- ruled rows: name on the left, mark on the right -->
  <g fill="#c4ccd8">
    <rect x="146" y="192" width="132" height="16" rx="8"/>
    <rect x="146" y="246" width="150" height="16" rx="8"/>
    <rect x="146" y="300" width="120" height="16" rx="8"/>
    <rect x="146" y="354" width="142" height="16" rx="8"/>
  </g>
  <g fill="#9fb3c4">
    <rect x="312" y="192" width="46" height="16" rx="8"/>
    <rect x="312" y="246" width="46" height="16" rx="8"/>
    <rect x="312" y="300" width="46" height="16" rx="8"/>
  </g>

  <!-- the result: a solid green tick badge on the last row -->
  <circle cx="335" cy="362" r="42" fill="url(#brand)"/>
  <path d="M316 362 l13 14 l24 -29" fill="none" stroke="#ffffff" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
