<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>GradeDesk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <h1>GradeDesk</h1>
        <div class="tag">Your grade sheet, offline</div>
      </div>

      <div class="sem">
        <label for="semesterSelect">Active semester</label>
        <select id="semesterSelect"></select>
      </div>

      <div class="railscroll">
        <div class="navsec">Courses</div>
        <nav id="courseNav"></nav>
        <div class="navsec">This course</div>
        <nav id="screenNav"></nav>
      </div>

      <div class="railfoot">
        <button class="railbtn" id="helpBtn" title="How to use GradeDesk">
          <span class="ico">?</span> Guide
        </button>
        <button class="railbtn" id="settingsBtn" title="Semesters and backups">
          <span class="ico">&#9881;</span> Manage
        </button>
        <div class="foot" id="saveStatus">Saved on this computer</div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="heading">
          <div class="crumbs" id="crumbs"></div>
          <h2 id="screenTitle">Grade entry</h2>
        </div>
        <div id="topActions"></div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="guide.js"></script>
  <script src="app.js"></script>
</body>
</html>
